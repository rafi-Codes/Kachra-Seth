# Stack Count Prediction System Configuration

# Data Configuration
data:
  categories:
    - banknotes
    - books
    - papers
    - tiles
    - cards
    - plates
  
  target_images_per_category: 500
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  
  image_size: 384
  augmentations:
    rotation:
      range: 15  # ±15 degrees
    zoom:
      min: 0.8
      max: 1.2
    brightness:
      jitter: 0.2
    noise:
      gaussian: true
      std: 0.01

  annotation_fields:
    - image_id
    - category
    - true_count
    - annotator_1_count
    - annotator_2_count
    - agreement_score
    - stack_angle
    - lighting
    - occlusion_percent

# Model Configuration
model:
  backbone: "efficientnet_b4"  # or "convnext_small"
  pretrained: true
  freeze_early_layers: true
  
  # Counting Head
  counting_head:
    hidden_layers: [512, 256]
    activation: "relu"
    dropout: 0.3
  
  # Confidence Head
  confidence_head:
    hidden_layers: [256, 128]
    activation: "relu"
    output_activation: "sigmoid"
  
  # Optional features
  use_density_map: false
  use_attention: false  # CBAM or SE
  attention_type: "cbam"

# Training Configuration
training:
  # Loss weights
  loss_weights:
    primary_loss: 0.8  # Huber loss for counting
    confidence_loss: 0.2  # BCE for confidence calibration
  
  # Optimizer
  optimizer:
    name: "adamw"
    lr: 0.0001
    weight_decay: 0.00001
  
  # Scheduler
  scheduler:
    name: "cosine_annealing"
    warmup_epochs: 5
    T_max: 100
  
  # Training parameters
  batch_size: 32
  epochs: 100
  gradient_clip_norm: 1.0
  accumulate_grad_batches: 1
  
  # Early stopping
  early_stopping:
    patience: 15
    monitor: "val_mae"
    mode: "min"
  
  # Curriculum learning phases
  curriculum:
    phase1:
      epochs: [1, 30]
      count_range: [5, 50]
    phase2:
      epochs: [31, 70]
      count_range: [5, 150]
    phase3:
      epochs: [71, 100]
      count_range: [5, 500]

# Inference Configuration
inference:
  image_size: 384
  mc_dropout_passes: 15
  confidence_thresholds:
    high: 0.90
    moderate: 0.70
    low: 0.50
  
  blur_threshold:
    laplacian_variance: 100
  
  edge_cases:
    max_count: 500
    min_stack_confidence: 0.3

# Metrics Configuration
metrics:
  targets:
    mae_small_stacks: 3  # for 5-50 items
    mae_medium_stacks: 5  # for 51-150 items
    mape_large_stacks: 0.08  # 8% for 151-500 items
    confidence_ece: 0.05
    within_5pct_accuracy: 0.85
  
  # Additional metrics to track
  track:
    - mae
    - mape
    - rmse
    - confidence_ece
    - within_5pct_accuracy
    - within_10pct_accuracy

# Logging Configuration
logging:
  tensorboard:
    enabled: true
    log_dir: "runs"
  
  wandb:
    enabled: false
    project: "stack-count-prediction"
  
  save checkpoints:
    enabled: true
    save_dir: "models/checkpoints"
    save_freq: 5
    save_best_only: true

# Deployment Configuration
deployment:
  export_formats:
    - onnx
    - tflite
    - coreml
  
  api:
    host: "0.0.0.0"
    port: 8000
    workers: 4
  
  active_learning:
    enabled: true
    correction_threshold: 0.10  # Flag if user correction differs by >10%
    retrain_interval_days: 30
    rolling_mae_window: 7
    performance_alert_threshold: 0.20  # Alert if MAE increases by >20%

# Paths Configuration
paths:
  data_root: "data"
  raw_data: "data/raw"
  processed_data: "data/processed"
  annotations: "data/annotations"
  synthetic_data: "data/synthetic"
  models: "models"
  checkpoints: "models/checkpoints"
  architectures: "models/architectures"
  onnx_exports: "models/onnx"
  configs: "configs"
  notebooks: "notebooks"
  tests: "tests"

# Hardware Configuration
hardware:
  device: "cuda"  # or "cpu"
  num_workers: 4
  pin_memory: true
